services:
  postgres:
    image: postgres:16-alpine
    container_name: helio-postgres
    environment:
      POSTGRES_USER: helio
      POSTGRES_PASSWORD: helio
      POSTGRES_DB: helio
    ports:
      - "5432:5432"
    volumes:
      - helio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helio-redis
    ports:
      - "6379:6379"
    volumes:
      - helio_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: helio-api
    env_file:
      - apps/api/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: helio-worker
    env_file:
      - apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  helio_pgdata:
  helio_redisdata:
